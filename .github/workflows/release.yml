name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Install frontend and browser test dependencies
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/Web/.playwright-browsers
        run: |
          ./scripts/Install-FrontendDependencies.ps1 -Run
          Push-Location Web
          npx --no-install playwright install chromium
          Pop-Location
      - name: Run correctness, browser, and security gates
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build, test, and package
        shell: pwsh
        env:
          SGH_SIGN_CERT_THUMBPRINT: ${{ secrets.SGH_SIGN_CERT_THUMBPRINT }}
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0-${{ github.run_number }}" }
          ./scripts/Build.ps1 -Version $version -SkipTests
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: social-games-hoster-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: social-games-hoster-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
